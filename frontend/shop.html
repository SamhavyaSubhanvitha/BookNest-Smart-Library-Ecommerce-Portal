<!DOCTYPE html>

<html>

<head>

    <title>Shop</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body{
        backdrop-filter:blur(8px);
        }
    </style>

</head>

<body>

    <nav class="navbar">

        <div class="logo">

            <div>

                <h2>BookNest</h2>

                <p>Discover • Shop • Read</p>

            </div>

        </div>

        <ul class="nav-links">

            <li><a href="index.html">Home</a></li>

            <li><a href="shop.html">Shop</a></li>

            <li><a href="cart.html">Cart</a></li>

            <li><a href="wishlist.html">Wishlist</a></li>

            <li><a href="orders.html">Orders</a></li>

            <li><a href="readerWall.html">Reader Wall</a></li>

            <li><a href="profile.html">Profile</a></li>

            <li><a href="signin.html">Logout</a></li>

        </ul>

    </nav>

    <div class="shop-wrapper">

        <h1 class="page-title">

Book Store

</h1>

        <div class="shop-search">

            <input id="searchInput" type="text" placeholder="Search books...">

            <button onclick="searchBooks()">

                Search

            </button>

        </div>

        <div id="shopContainer" class="shop-grid">

        </div>

    </div>

    <!-- ================= BOOK DETAILS POPUP ================= -->

    <div id="detailsPopup" class="details-popup">

        <div class="details-box">

            <button class="details-close" onclick="closeDetails()">
                ✕
            </button>

            <h2 id="popupTitle"></h2>

            <div id="popupBody"></div>

        </div>

    </div>

    <script src="script.js"></script>

    <script>
        loadBooks();
    </script>

</body>

</html>
