<!DOCTYPE html>

<html>

<head>

<title>Orders</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    backdrop-filter: blur(8px);
}


/* MESSAGE POPUP */

#messagePopup,
#experiencePopup{

    display:none;

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.65);

    justify-content:center;
    align-items:center;

    z-index:9999;

}


/* POPUP BOX */

.popup-box{

    width:450px;

    background:#2d1919;

    color:white;

    padding:30px;

    border-radius:20px;

    text-align:center;

}


.popup-box textarea{

    width:100%;

    height:120px;

    padding:12px;

    margin-top:15px;

    border-radius:10px;

    border:none;

    resize:none;

}


.popup-buttons{

    display:flex;

    justify-content:center;

    gap:15px;

    margin-top:20px;

}


.popup-buttons button{

    padding:10px 20px;

    border:none;

    border-radius:10px;

    cursor:pointer;

    font-weight:bold;

}


.send-btn{

    background:#4caf50;

    color:white;

}


.close-btn{

    background:#777;

    color:white;

}


/* ORDER BUTTONS */

.order-buttons{

    display:flex;

    justify-content:center;

    gap:10px;

    margin-top:15px;

    flex-wrap:wrap;

}


.order-btn{

    border:none;

    padding:10px 14px;

    border-radius:10px;

    cursor:pointer;

    font-weight:bold;

    color:white;

}


.message-btn{

    background:#8a6038;

}


.reader-btn{

    background:#4b2b2b;

}


.order-btn:hover{

    transform:scale(1.03);

}

</style>

</head>


<body>


<nav class="navbar">

<div class="logo">

<div>

<h2>BookNest</h2>

<p>Discover • Shop • Read</p>

</div>

</div>


<ul class="nav-links">

<li><a href="index.html">Home</a></li>

<li><a href="shop.html">Shop</a></li>

<li><a href="cart.html">Cart</a></li>

<li><a href="wishlist.html">Wishlist</a></li>

<li><a href="orders.html">Orders</a></li>

<li><a href="readerWall.html">Reader Wall</a></li>

<li><a href="profile.html">Profile</a></li>

<li><a href="signin.html">Logout</a></li>

</ul>

</nav>


<div class="page-container">

<h1 class="page-title">

My Orders

</h1>


<div id="ordersContainer" class="orders-grid">

</div>

</div>


<!-- ================= MESSAGE AUTHOR POPUP ================= -->

<div id="messagePopup">

    <div class="popup-box">

        <h2>Message Author</h2>

        <p id="messageBookTitle"></p>

        <textarea
            id="authorMessage"
            placeholder="Write your message to the author...">
        </textarea>

        <div class="popup-buttons">

            <button
                type="button"
                class="send-btn"
                onclick="sendAuthorMessage()">

                Send Message

            </button>


            <button
                type="button"
                class="close-btn"
                onclick="closePopup()">

                Cancel

            </button>

        </div>

    </div>

</div>


<!-- ================= READER WALL POPUP ================= -->

<div id="experiencePopup">

    <div class="popup-box">

        <h2>Share Your Experience</h2>

        <p id="experienceBookTitle"></p>

        <textarea
            id="experienceMessage"
            maxlength="250"
            placeholder="Share your experience with this book...">
        </textarea>

        <p>
            Characters:
            <span id="count">0</span>/250
        </p>


        <div class="popup-buttons">

            <button
                type="button"
                class="send-btn"
                onclick="submitExperience()">

                Post to Reader Wall

            </button>


            <button
                type="button"
                class="close-btn"
                onclick="closeExperience()">

                Cancel

            </button>

        </div>

    </div>

</div>


<script src="script.js"></script>

<script>

loadOrders();

</script>


</body>

</html>
